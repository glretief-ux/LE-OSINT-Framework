name: Full link audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/audit_links.py
      - name: Publish report to the audit-results branch
        run: |
          git config user.name "link-audit"
          git config user.email "link-audit@users.noreply.github.com"
          mkdir -p /tmp/rep && cp reports/* /tmp/rep/
          git fetch origin audit-results || true
          git checkout --orphan audit-results-tmp
          git rm -rf --cached . > /dev/null
          rm -rf ./* .github
          cp /tmp/rep/* .
          git add link-audit.json link-audit.md
          git commit -m "Link audit $(date -u +%F' '%H:%M)"
          git push -f origin HEAD:audit-results
