name: Weekly link check

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday 05:17 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract URLs from data/links.js
        run: python3 tools/extract_links.py

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Many OSINT sites block bots (403/429/999) - treat those as "alive".
          args: >-
            --no-progress --max-concurrency 8 --timeout 25 --max-retries 2
            --accept 200..=299,301,302,303,307,308,401,403,405,406,429,999
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
            links.txt
          output: ./lychee-report.md
          fail: false

      - name: Open an issue with broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links found (weekly check)"
          content-filepath: ./lychee-report.md
          labels: broken-links
